# 業務管理 河村図書教材社  v2.10.5  (2026-10-07)
name = "mitsumori"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# 画面(public フォルダ)を一緒に配信する
[assets]
directory = "./public"
binding = "ASSETS"
# /api/ 以外は静的ファイルをそのまま返す
run_worker_first = ["/api/*"]

# データベース(D1)。database_id は手順書の「D1を作る」で表示される値に書き換える
[[d1_databases]]
binding = "DB"
database_name = "mitsumori-db"
database_id = "8a33b9de-ee61-4830-ba68-0547eb576e9b"

[vars]
# ログイン保護(Cloudflare Access)を設定したら、次の2つを入れる(手順書参照)
ACCESS_TEAM_DOMAIN = ""   # 例: yourteam.cloudflareaccess.com
ACCESS_AUD = ""           # Accessアプリの「Application Audience (AUD) Tag」
GEMINI_MODEL = "gemini-3.8-flash"
