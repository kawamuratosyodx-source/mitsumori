<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>業務管理</title>
<script src="/vendor/xlsx.full.min.js" defer></script>
<script src="/vendor/encoding.min.js" defer></script>
<script>
window.addEventListener('error', function(e){
  var a = document.getElementById('app');
  if (a && a.textContent.indexOf('読み込み中') === 0) a.innerHTML = '<div style="padding:12px;background:#fff;border-radius:8px"><b>画面の読み込みでエラーが起きました</b><pre style="white-space:pre-wrap;font-size:13px">' + String(e.message || '').replace(/</g, '&lt;') + '\n(行 ' + e.lineno + ')</pre><p>ページを開き直してください。直らないときは管理者に連絡してください。</p></div>';
});
</script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:#f4f5f7;color:#1f2937;font-size:15px}
header{background:#1f3a5f;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:none;cursor:pointer}
header .co{flex:1;min-width:0;text-align:right;font-size:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .ver{font-size:11px;opacity:.7}
main{max-width:900px;margin:0 auto;padding:12px}
.bar{display:flex;gap:8px;margin-bottom:12px}
.bar input{flex:1;min-width:0}
input,select,textarea{width:100%;padding:9px;border:1px solid #c5cad3;border-radius:6px;font-size:16px;background:#fff;font-family:inherit}
textarea{min-height:70px}
button{padding:9px 13px;border:1px solid #c5cad3;background:#fff;border-radius:6px;font-size:14px;cursor:pointer;white-space:nowrap}
button.pri{background:#1f6feb;color:#fff;border-color:#1f6feb}
button.dng{color:#b42318;border-color:#e6b3ae}
.card{background:#fff;border-radius:8px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card.click{cursor:pointer}
.tile{padding:18px}.tile b{font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.mute{color:#6b7280;font-size:13px}
h2{font-size:15px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
h2 span{flex:1}
label{display:block;font-size:13px;color:#4b5563;margin:10px 0 3px}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;background:#e5edff;color:#1e429f;font-size:12px}
.ln{background:#fafbfc;border:1px solid #e5e7eb;border-radius:6px;padding:8px;margin-bottom:8px}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tot{text-align:right;line-height:1.8}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:6px;border:1px solid #ddd;cursor:pointer;background:#eee}
label.fb{display:inline-block;margin:0;padding:9px 13px;border:1px solid #c5cad3;border-radius:6px;background:#fff;font-size:14px;cursor:pointer;color:#1f2937}
.thumbs .pdf{width:76px;height:76px;border-radius:6px;border:1px solid #ddd;background:#fdecea;color:#b42318;font-size:13px;font-weight:bold;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#pdfbox{display:none;width:96vw;max-width:920px;height:76vh;overflow:auto;background:#525659;border-radius:6px;-webkit-overflow-scrolling:touch;color:#fff;text-align:center}
#pdfbox canvas{display:block;margin:8px auto;background:#fff;max-width:100%;height:auto}
#ov img{max-width:96vw;max-height:80vh}
#busy{display:none;position:fixed;top:56px;right:12px;background:#111;color:#fff;padding:6px 12px;border-radius:6px;font-size:13px;z-index:30}
table th,table td{padding:5px 8px;border-bottom:1px solid #e5e7eb}td.n{text-align:right}
</style>
</head>
<body>
<header><h1 onclick="go('menu')">業務管理</h1><span class="co">有限会社　河村図書教材社</span><span class="ver">v2000</span><button onclick="reload()">更新</button></header>
<main id="app">読み込み中...</main>
<div id="ov"><img id="ovimg"><div id="pdfbox"></div><div class="row"><button id="ovdl" style="display:none">PDFをダウンロード</button><button id="ovdel" class="dng">削除</button><button onclick="closeOv()">閉じる</button></div></div>
<div id="busy">処理中...</div>
<script src="/app.js" defer></script>
</body>
</html>
